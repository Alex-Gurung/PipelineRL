defaults:
  - base
  - finetune/dapo
  - _self_

actor:
  rollout_policy: pipelinerl.domains.scitrek.rollouts.generate_scitrek_rollout
  # Encourage boxed final answer to match reward extractor
  # system_prompt: Please reason step by step, and put your final answer within \\boxed{}.

environment: null

dataset_loader: pipelinerl.domains.scitrek.load_datasets.load_scitrek
dataset_loader_params:
  data_dir: null      # e.g., /mnt/disk/sci/scitrek_data
  train_file: null    # optional explicit override
  val_file: null      # optional explicit override

train_dataset_names:
  - train

test_dataset_names:
  - val


attempts: 16

llm:
  parameters:
    max_tokens: 3000
    temperature: 1.0

finetune:
  seq_length: 5000  # Input ~2000 + output 3000 tokens
  rl:
    # SciTrek-specific DAPO settings (rewards in range [0, 2] from em+f1)
    clip_ratio_high: 0.28
    dynamic_filtering_reward_range: [0.75, 2.0]
    kl_coef: 0.0  # Disable KL for SciTrek

vllm_config:
  use_v1: true
  vllm_kwargs:
    trust-remote-code: ""  # required for many Qwen models

model_path: Qwen/Qwen3-4B-Instruct-2507
