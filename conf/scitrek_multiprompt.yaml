# python -m pipelinerl.launch \
#   --config-name scitrek \
#   model_path=Qwen/Qwen3-4B-Instruct-2507 \
#   dataset_loader_params.data_dir=/mnt/disk/sci/scitrek_data finetune.keep_intermediate_checkpoints=false

defaults:
  - base
  - finetune/dapo
  - _self_

actor:
  rollout_policy: pipelinerl.domains.scitrek.rollouts.generate_scitrek_rollout
  # Encourage boxed final answer to match reward extractor
  # system_prompt: Please reason step by step, and put your final answer within \\boxed{}.
  # Match OpenRLHF-style concurrency: 2 vLLM engines * 64 = 128 rollouts
  llm_max_rollouts: 64
  rollout_workers: 2

environment: null

dataset_loader: pipelinerl.domains.scitrek.load_datasets.load_scitrek
dataset_loader_params:
  data_dir: null      # e.g., /mnt/disk/sci/scitrek_data
  train_file: null    # optional explicit override
  val_file: null      # optional explicit override

train_dataset_names:
  - train

test_dataset_names:
  - val


attempts: 16
# attempts: 8
# attempts: 4
seq_parallel: 1  # Disabled for long-prompt training (packing breaks batch alignment)

llm:
  parameters:
    max_tokens: 3000
    temperature: 1.0

test_llm:
  parameters:
    # Cap test-time generations to 3000 tokens too
    max_tokens: 3000
    temperature: 1.0

finetune:
  # Use DDP by default (no DeepSpeed, no FSDP)
  seq_length: 5000  # Input ~2000 + output 3000 tokens
  seq_packing: false  # Disabled for long-prompt training (packing breaks batch alignment)
  train_batch_size: 1
  gradient_accumulation_passes: 64
  # learning_rate: 5e-7
  learning_rate: 5e-6
  save_checkpoint_steps: 16
  rl:
    # SciTrek-specific DAPO settings (rewards in range [0, 2] from em+f1)
    clip_ratio_high: 0.3
    dynamic_filtering_reward_range: [0.75, 2.0]
    kl_coef: 0.0  # Disable KL for SciTrek

    # === Multi-prompt training settings ===
    # Requires dataset with both 'messages' (short/metadata) and 'messages_long' (full articles)

    # Dual RL objective: compute separate losses for short and long prompts
    # Final loss = (1-w)*loss_short + w*loss_long
    enable_long_prompt_rl: true
    long_prompt_rl_weight: 0.5  # Equal weighting between short and long objectives

    # Separate sequence length for long prompts (short prompts use seq_length above)
    # Long prompts are ~115k tokens, so set to 120k to allow prompt + 3k completion + buffer
    long_prompt_seq_length: 124000

    # KV cache optimization for long-prompt forward pass
    # When true: splits into no-grad prefill + grad continuation (~100x memory savings)
    # When false: standard full forward pass (simpler, easier to debug)
    # Recommended: false for debugging, true for production with >50k token prompts
    use_kv_cache_for_long_prompts: false

    # Importance sampling correction: π_new(a|long) / π_new(a|short)
    # Corrects distribution mismatch when sampling from short but optimizing for long
    # (can be used with or without enable_long_prompt_rl)
    enable_long_prompt_is: false

    # Knowledge distillation: Keep reasoning consistent across prompt formats
    # Minimizes KL(π_new(·|short) || π_new(·|long))
    enable_reasoning_distillation: false
    distillation_coef: 0.1
    distillation_top_k: null  # null = Schulman approx, 0 = full vocab KL, int = top-k KL

use_deepspeed: true
use_fsdp: false
# deepspeed_config: deepspeed_stage3_bf16_cpuoffload
  # use_fsdp: true 

vllm_config:
  use_v1: true
  vllm_kwargs:
    trust-remote-code: ""  # required for many Qwen models
    max-model-len: 5000  # Actor vLLM only needs short prompts
    gpu-memory-utilization: 0.9
  # ref_vllm_kwargs:
  #   # Reference model needs to support long prompts for computing ref logprobs
  #   trust-remote-code: ""
  #   max-model-len: 120000  # Must support long_prompt_seq_length
  #   gpu-memory-utilization: 0.9

eval_every_n_versions: 16

wandb:
  wandb_project_name: scitrek_multiprompt_pipelinerl
  wandb_group: grpo_scitrek_multiprompt_v1

lora:
  enabled: True
  task_type: CAUSAL_LM # supported: CAUSAL_LM, SEQ_2_SEQ_LM
  base_model_8bit: False # format used for storing base mode weights during forward
  base_model_4bit: False
  r: 16 # Lora attention dimension.
  alpha: 32 # the alpha parameter for Lora scaling.
  dropout: 0.00 # the dropout probability for Lora layers.
  bias: "none" # Bias type for Lora. Can be 'none', 'all' or 'lora_only'
  target_modules: "all-linear" # the names of the modules to apply Lora to.

model_path: Qwen/Qwen3-4B-Instruct-2507
